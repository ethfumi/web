<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morph</title>
<style>
  html, body { margin: 0; height: 100%; background: #02030a; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud {
    position: fixed; left: 4vw; bottom: 5vh; color: #dfe8ff;
    font: 500 12px/1 ui-monospace, "SF Mono", Consolas, "Cascadia Mono", monospace;
    letter-spacing: 0.32em; text-transform: uppercase; user-select: none; pointer-events: none;
  }
  .cap { display: flex; align-items: baseline; gap: 1.4em; transition: opacity .45s ease, transform .45s ease; }
  .cap.off { opacity: 0; transform: translateY(6px); }
  .num { opacity: .45; }
  .name { font-size: 22px; font-weight: 300; letter-spacing: 0.42em; }
  .bars { display: flex; gap: 6px; margin-top: 18px; }
  .bar { width: 44px; height: 2px; background: rgba(223, 232, 255, .16); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: #dfe8ff; transform-origin: left; transform: scaleX(0); }
  .tag {
    position: fixed; right: 4vw; top: 5vh; color: rgba(223, 232, 255, .4);
    font: 500 11px/1 ui-monospace, "SF Mono", Consolas, "Cascadia Mono", monospace;
    letter-spacing: 0.32em; text-transform: uppercase; user-select: none; pointer-events: none;
  }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, .65) 100%); }
  .err { position: fixed; inset: 0; display: grid; place-items: center; color: #dfe8ff; font: 14px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="tag" id="tag"></div>
<div class="hud">
  <div class="cap" id="cap"><span class="num" id="num">01 / 05</span><span class="name" id="name">Galaxy</span></div>
  <div class="bars" id="bars"></div>
</div>

<script id="vs" type="x-shader/x-vertex">
precision highp float;
attribute vec4 a_seed;
attribute vec4 a_seed2;
uniform float u_time, u_local, u_a, u_b, u_aspect, u_px, u_intro, u_gain;
varying vec3 v_col;
varying float v_alpha;

const float PI = 3.14159265;
const float TAU = 6.2831853;
const float HOLD = 2.3;
const float F = 1.8;

mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

vec3 galaxy(vec4 s, float t) {
  float r = pow(s.y, 0.7) * 1.7 + 0.02;
  float arm = floor(s.x * 3.0) / 3.0 * TAU;
  float sp = fract(s.x * 3.0) - 0.5;
  sp = sp * sp * sp * 8.0;
  float ang = arm + r * 2.4 + sp * 1.6 - t * 0.25 / (0.35 + r);
  float h = (s.z - 0.5) * (0.35 * exp(-r * 1.8) + 0.04);
  return vec3(cos(ang) * r, h, sin(ang) * r);
}

vec3 sphere(vec4 s, float t) {
  float y = s.x * 2.0 - 1.0;
  float inner = step(0.75, s.z);
  float a = s.y * TAU + t * mix(0.15, -0.5, inner);
  float rr = sqrt(1.0 - y * y);
  vec3 p = vec3(rr * cos(a), y, rr * sin(a));
  float d = 1.0 + 0.10 * sin(p.y * 7.0 - t * 2.2) + 0.06 * sin(a * 5.0 + t * 1.5) * rr;
  return p * d * mix(1.1, 0.5, inner);
}

vec3 knotC(float u) {
  float R = 0.8, r0 = 0.36;
  float w = R + r0 * cos(3.0 * u);
  return vec3(w * cos(2.0 * u), r0 * sin(3.0 * u), w * sin(2.0 * u));
}

vec3 knot(vec4 s, float t) {
  float u = s.x * TAU + t * 0.2;
  vec3 c = knotC(u);
  vec3 T = normalize(knotC(u + 0.01) - c);
  vec3 N = normalize(cross(T, vec3(0.0, 1.0, 0.0)));
  vec3 B = cross(T, N);
  float v = s.y * TAU + u * 4.0;
  float tube = 0.15 * (0.55 + 0.45 * sqrt(s.z));
  return (c + (N * cos(v) + B * sin(v)) * tube) * 1.3;
}

vec3 wave(vec4 s, float t) {
  float gx = s.x * 2.0 - 1.0, gz = s.y * 2.0 - 1.0;
  if (s.z < 0.5) gx = (floor(gx * 18.0) + 0.5) / 18.0;
  else gz = (floor(gz * 18.0) + 0.5) / 18.0;
  vec2 q = vec2(gx, gz) * 1.9;
  float d = length(q);
  float y = 0.28 * sin(d * 5.0 - t * 2.6) * exp(-d * 0.7) + 0.10 * sin(q.x * 3.0 + t) * cos(q.y * 2.5 - t * 0.7);
  return vec3(q.x, y - 0.15, q.y);
}

vec3 lattice(vec4 s, float t) {
  vec3 p = s.xyz * 2.0 - 1.0;
  vec3 q = floor(p * 2.0 + 0.5) / 2.0;
  float k = s.w * 3.0;
  if (k < 1.0) p = vec3(p.x, q.y, q.z);
  else if (k < 2.0) p = vec3(q.x, p.y, q.z);
  else p = vec3(q.x, q.y, p.z);
  return p * 0.85 * (1.0 + 0.04 * sin(t * 2.0 + (q.x + q.y + q.z) * 3.0));
}

vec3 shape(float i, vec4 s, float t) {
  if (i < 0.5) return galaxy(s, t);
  if (i < 1.5) return sphere(s, t);
  if (i < 2.5) return knot(s, t);
  if (i < 3.5) return wave(s, t);
  return lattice(s, t);
}

float hueOf(float i) {
  if (i < 0.5) return 0.30;
  if (i < 1.5) return 0.42;
  if (i < 2.5) return 0.12;
  if (i < 3.5) return 0.72;
  return 0.92;
}

vec3 pal(float x) { return 0.5 + 0.5 * cos(TAU * (x + vec3(0.0, 0.33, 0.67))); }

void main() {
  vec4 s = a_seed, r = a_seed2;
  float star = step(s.w, 0.02);
  float k = 0.0, mid = 0.0, alpha = 1.0;
  vec3 p, col;

  if (star > 0.5) {
    p = normalize(r.yzw - 0.5) * (5.0 + 3.0 * r.x);
    col = mix(vec3(0.7, 0.8, 1.0), vec3(1.0, 0.85, 0.7), s.x);
    alpha = 0.9 * (0.55 + 0.45 * sin(u_time * 2.0 + r.x * 100.0));
  } else {
    vec3 A = shape(u_a, s, u_time);
    vec3 B = shape(u_b, s, u_time);
    // 中心から外へ波及する順に乗り換える
    float st = 0.6 * clamp(length(A) / 1.6, 0.0, 1.0) + 0.4 * r.x;
    k = smoothstep(0.0, 1.0, (u_local - HOLD - st * 0.7) / 0.75);
    mid = sin(PI * k);
    p = mix(A, B, k);
    p.xz = rot(mid * 1.4 * (0.5 + r.y)) * p.xz;
    p += mid * (r.yzw - 0.5) * 0.7;
    p += mid * 0.22 * vec3(sin(p.y * 3.0 + u_time * 1.3), sin(p.z * 3.0 + u_time * 1.7), sin(p.x * 3.0 + u_time));
    p *= u_intro;
    float hue = mix(hueOf(u_a), hueOf(u_b), k) + 0.16 * (r.z - 0.5) + 0.10 * length(p);
    col = pal(hue);
    col = mix(col, vec3(1.0), 0.15 + 0.35 * mid);
    col *= 0.6 + 0.8 * r.y;
  }

  p.xz = rot(u_time * 0.22) * p.xz;
  p.yz = rot(0.42 + 0.2 * sin(u_time * 0.19)) * p.yz;
  float zc = p.z + 3.7 + 0.35 * sin(u_time * 0.31);

  float size = mix(0.006, 0.015, r.z * r.z);
  if (star < 0.5 && r.w < 0.04) { size *= 7.0; alpha *= 0.10; }
  float sc = min(1.0, u_aspect);
  float ps = u_px * size * F / max(zc, 0.05) * 0.5 * sc;
  if (ps < 1.5) { alpha *= (ps / 1.5) * (ps / 1.5); ps = 1.5; }

  float fog = 1.0 - smoothstep(2.2, 5.9, zc);
  v_col = col;
  v_alpha = alpha * u_gain * mix(0.35, 1.0, star > 0.5 ? 1.0 : fog);
  gl_PointSize = ps;
  gl_Position = vec4(p.x * F / u_aspect * sc, p.y * F * sc, 0.0, zc);
}
</script>

<script id="fs" type="x-shader/x-fragment">
precision mediump float;
varying vec3 v_col;
varying float v_alpha;
void main() {
  vec2 d = gl_PointCoord - 0.5;
  float r2 = dot(d, d) * 4.0;
  if (r2 > 1.0) discard;
  float a = 1.0 - r2;
  gl_FragColor = vec4(v_col * a * a * v_alpha, 1.0);
}
</script>

<script>
(() => {
  const NAMES = ['Galaxy', 'Sphere', 'Torus Knot', 'Ripple', 'Lattice'];
  const SEG = 4.0, HOLD = 2.3;

  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  if (!gl) {
    document.body.insertAdjacentHTML('beforeend', '<div class="err">WebGL is not available.</div>');
    return;
  }

  const small = innerWidth * innerHeight < 700 * 700;
  const N = small ? 80000 : 160000;
  document.getElementById('tag').textContent = `Morph · ${N / 1000}k particles`;

  const compile = (type, id) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, document.getElementById(id).textContent);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, 'vs'));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, 'fs'));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const attr = (name) => {
    const data = new Float32Array(N * 4);
    for (let i = 0; i < data.length; i++) data[i] = Math.random();
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, name);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 4, gl.FLOAT, false, 0, 0);
  };
  attr('a_seed');
  attr('a_seed2');

  const U = {};
  for (const n of ['u_time', 'u_local', 'u_a', 'u_b', 'u_aspect', 'u_px', 'u_intro', 'u_gain']) {
    U[n] = gl.getUniformLocation(prog, n);
  }

  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.clearColor(0.008, 0.012, 0.035, 1);

  const resize = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, w, h);
    gl.uniform1f(U.u_aspect, w / h);
    gl.uniform1f(U.u_px, h);
  };
  addEventListener('resize', resize);
  resize();
  gl.uniform1f(U.u_gain, 0.42 * 160000 / N);

  const cap = document.getElementById('cap');
  const num = document.getElementById('num');
  const name = document.getElementById('name');
  const bars = document.getElementById('bars');
  const fills = NAMES.map(() => {
    const b = document.createElement('div');
    b.className = 'bar';
    const i = b.appendChild(document.createElement('i'));
    bars.appendChild(b);
    return i;
  });

  let shown = -1;
  const t0 = performance.now();
  const frame = (now) => {
    const t = window.__t ?? (now - t0) / 1000;
    const cyc = t % (SEG * NAMES.length);
    const seg = Math.floor(cyc / SEG);
    const local = cyc - seg * SEG;

    gl.uniform1f(U.u_time, t);
    gl.uniform1f(U.u_local, local);
    gl.uniform1f(U.u_a, seg);
    gl.uniform1f(U.u_b, (seg + 1) % NAMES.length);
    gl.uniform1f(U.u_intro, 1 - Math.pow(2, -5 * t));
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.POINTS, 0, N);

    if (seg !== shown) {
      shown = seg;
      num.textContent = `0${seg + 1} / 0${NAMES.length}`;
      name.textContent = NAMES[seg];
    }
    cap.classList.toggle('off', local > HOLD + 0.5);
    fills.forEach((f, i) => {
      f.style.transform = `scaleX(${i < seg ? 1 : i === seg ? local / SEG : 0})`;
    });

    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
