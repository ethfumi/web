<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="しんかんせん">
<title>しんかんせん GO!</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- 車両えらび画面 -->
<div id="select-screen">
  <div class="select-title">どれにのる？</div>
  <div class="train-buttons">
    <button class="train-btn" data-train="nozomi" aria-label="のぞみ">
      <svg viewBox="0 0 200 70">
        <path d="M10 55 Q10 25 55 22 L185 22 Q195 22 195 35 L195 55 Q195 60 190 60 L15 60 Q10 60 10 55 Z" fill="#f8f8f8" stroke="#ccc" stroke-width="2"/>
        <path d="M12 40 Q20 30 60 28 L195 28 L195 36 L12 44 Z" fill="#1c48a6"/>
        <rect x="70" y="30" width="22" height="12" rx="3" fill="#333"/>
        <rect x="105" y="30" width="22" height="12" rx="3" fill="#333"/>
        <rect x="140" y="30" width="22" height="12" rx="3" fill="#333"/>
        <circle cx="55" cy="60" r="7" fill="#555"/><circle cx="95" cy="60" r="7" fill="#555"/><circle cx="150" cy="60" r="7" fill="#555"/>
      </svg>
      <span>のぞみ</span>
    </button>
    <button class="train-btn" data-train="doctoryellow" aria-label="ドクターイエロー">
      <svg viewBox="0 0 200 70">
        <path d="M10 55 Q10 25 55 22 L185 22 Q195 22 195 35 L195 55 Q195 60 190 60 L15 60 Q10 60 10 55 Z" fill="#ffd900" stroke="#d4b400" stroke-width="2"/>
        <path d="M12 40 Q20 30 60 28 L195 28 L195 36 L12 44 Z" fill="#1c48a6"/>
        <rect x="70" y="30" width="22" height="12" rx="3" fill="#333"/>
        <rect x="105" y="30" width="22" height="12" rx="3" fill="#333"/>
        <rect x="140" y="30" width="22" height="12" rx="3" fill="#333"/>
        <circle cx="55" cy="60" r="7" fill="#555"/><circle cx="95" cy="60" r="7" fill="#555"/><circle cx="150" cy="60" r="7" fill="#555"/>
      </svg>
      <span>ドクターイエロー</span>
    </button>
    <button class="train-btn" data-train="hayabusa" aria-label="はやぶさ">
      <svg viewBox="0 0 200 70">
        <path d="M10 55 Q10 25 55 22 L185 22 Q195 22 195 35 L195 55 Q195 60 190 60 L15 60 Q10 60 10 55 Z" fill="#f7f5ed" stroke="#218b7a" stroke-width="2"/>
        <path d="M10 42 Q17 25 55 22 L185 22 Q195 22 195 35 L195 39 L60 36 Q25 36 10 48 Z" fill="#36a995"/>
        <path d="M12 43 Q25 37 60 36 L195 39 L195 44 L12 49 Z" fill="#e73d8f"/>
        <rect x="70" y="30" width="22" height="12" rx="3" fill="#333"/>
        <rect x="105" y="30" width="22" height="12" rx="3" fill="#333"/>
        <rect x="140" y="30" width="22" height="12" rx="3" fill="#333"/>
        <circle cx="55" cy="60" r="7" fill="#555"/><circle cx="95" cy="60" r="7" fill="#555"/><circle cx="150" cy="60" r="7" fill="#555"/>
      </svg>
      <span>はやぶさ</span>
    </button>
  </div>
</div>

<!-- 走行画面の操作ボタン -->
<div id="run-ui" class="hidden">
  <button class="btn-quick-add" data-slot="0"><span class="quick-train-art"></span><span class="quick-plus">＋</span></button>
  <button class="btn-quick-add" data-slot="1"><span class="quick-train-art"></span><span class="quick-plus">＋</span></button>
  <button class="btn-quick-add" data-slot="2"><span class="quick-train-art"></span><span class="quick-plus">＋</span></button>
  <button id="btn-couple" class="btn-quick-add" aria-label="いまの車両を連結"><span class="quick-train-art"></span><span class="quick-plus">＋</span></button>
  <button id="btn-remove" aria-label="きりはなす">🚃−</button>
  <button id="btn-home" aria-label="えらびなおす">🏠</button>
</div>

<div id="drive-panel" class="hidden">
  <div id="speed-meter" aria-label="いまのスピードと総走行距離">
    <div class="speed-row"><span id="speed-value">0</span><small>km/h</small></div>
    <div id="distance-meter"><small>そうこうきょり</small><div class="distance-main"><span id="distance-value">0</span><small>m</small></div><small id="distance-km-value">0.0 km</small></div>
  </div>
  <button id="btn-express" aria-label="中央特快モードにする" aria-pressed="false">
    <span>🚄</span><span id="express-label">かくえき</span>
  </button>
  <button id="btn-running-sound" aria-label="走行音を消す" aria-pressed="true">
    <span id="running-sound-icon">🔊</span><span>そうこうおん</span>
  </button>
</div>

<div id="arrival-banner" class="hidden">とうちゃく〜！</div>

<button id="btn-komachi-couple" class="hidden" aria-label="こまちとれんけつ">
  <span class="couple-icon">🚄💞🚅</span>
  <span>れんけつ！</span>
</button>

<button id="btn-station-doors" class="hidden" aria-label="ドアをあける">
  <span class="door-icon">🚪</span>
  <span id="door-label">ドアをあける</span>
</button>

<div id="station-passengers" class="hidden" aria-hidden="true">
  <span>🐰</span><span>🐻</span><span>🐧</span>
</div>

<div id="route-event-banner" class="hidden" role="status" aria-live="polite"></div>

<button id="btn-headlight" class="hidden" aria-label="ライトをつける">
  <span>🔦</span><span id="headlight-label">ライトをつける</span>
</button>

<script src="app.js"></script>
</body>
</html>
