<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="つなげて！でんしゃ！">
<title>つなげて！でんしゃ！</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- 車両えらび画面 -->
<div id="select-screen">
  <div class="select-title">どこを はしる？</div>
  <div class="route-buttons" role="group" aria-label="はしるろせん">
    <button class="route-btn selected" data-route="chuo" aria-pressed="true"><span>🟧</span>ちゅうおうせん</button>
    <button class="route-btn" data-route="tokaido" aria-pressed="false"><span>🗻</span>とうかいどう</button>
    <button class="route-btn" data-route="tohoku" aria-pressed="false"><span>🌲</span>とうほく</button>
    <button class="route-btn" data-route="sobu" aria-pressed="false"><span>🟨</span>そうぶせん</button>
    <button class="route-btn" data-route="tozai" aria-pressed="false"><span>🔵</span>とうざいせん</button>
    <button class="route-btn" data-route="inokashira" aria-pressed="false"><span>🌈</span>いのかしらせん</button>
    <button class="route-btn" data-route="keio" aria-pressed="false"><span>🟥</span>けいおうせん</button>
    <button class="route-btn" data-route="yamanote" aria-pressed="false"><span>🟩</span>やまのてせん</button>
  </div>
  <div class="train-select-title">どれに のる？</div>
  <div class="train-buttons">
    <button class="train-btn" data-train="nozomi" aria-label="のぞみ">
      <svg viewBox="0 0 200 70">
        <path d="M10 55 Q10 25 55 22 L185 22 Q195 22 195 35 L195 55 Q195 60 190 60 L15 60 Q10 60 10 55 Z" fill="#f8f8f8" stroke="#ccc" stroke-width="2"/>
        <path d="M12 40 Q20 30 60 28 L195 28 L195 36 L12 44 Z" fill="#1c48a6"/>
        <rect x="70" y="30" width="22" height="12" rx="3" fill="#333"/>
        <rect x="105" y="30" width="22" height="12" rx="3" fill="#333"/>
        <rect x="140" y="30" width="22" height="12" rx="3" fill="#333"/>
        <circle cx="55" cy="60" r="7" fill="#555"/><circle cx="95" cy="60" r="7" fill="#555"/><circle cx="150" cy="60" r="7" fill="#555"/>
      </svg>
      <span>のぞみ</span>
    </button>
    <button class="train-btn" data-train="doctoryellow" aria-label="ドクターイエロー">
      <svg viewBox="0 0 200 70">
        <path d="M10 55 Q10 25 55 22 L185 22 Q195 22 195 35 L195 55 Q195 60 190 60 L15 60 Q10 60 10 55 Z" fill="#ffd900" stroke="#d4b400" stroke-width="2"/>
        <path d="M12 40 Q20 30 60 28 L195 28 L195 36 L12 44 Z" fill="#1c48a6"/>
        <rect x="70" y="30" width="22" height="12" rx="3" fill="#333"/>
        <rect x="105" y="30" width="22" height="12" rx="3" fill="#333"/>
        <rect x="140" y="30" width="22" height="12" rx="3" fill="#333"/>
        <circle cx="55" cy="60" r="7" fill="#555"/><circle cx="95" cy="60" r="7" fill="#555"/><circle cx="150" cy="60" r="7" fill="#555"/>
      </svg>
      <span>ドクターイエロー</span>
    </button>
    <button class="train-btn" data-train="hayabusa" aria-label="はやぶさ">
      <svg viewBox="0 0 200 70">
        <path d="M10 55 Q10 25 55 22 L185 22 Q195 22 195 35 L195 55 Q195 60 190 60 L15 60 Q10 60 10 55 Z" fill="#f7f5ed" stroke="#218b7a" stroke-width="2"/>
        <path d="M10 42 Q17 25 55 22 L185 22 Q195 22 195 35 L195 39 L60 36 Q25 36 10 48 Z" fill="#36a995"/>
        <path d="M12 43 Q25 37 60 36 L195 39 L195 44 L12 49 Z" fill="#e73d8f"/>
        <rect x="70" y="30" width="22" height="12" rx="3" fill="#333"/>
        <rect x="105" y="30" width="22" height="12" rx="3" fill="#333"/>
        <rect x="140" y="30" width="22" height="12" rx="3" fill="#333"/>
        <circle cx="55" cy="60" r="7" fill="#555"/><circle cx="95" cy="60" r="7" fill="#555"/><circle cx="150" cy="60" r="7" fill="#555"/>
      </svg>
      <span>はやぶさ</span>
    </button>
    <button class="train-btn" data-train="komachi" aria-label="こまち">
      <svg viewBox="0 0 200 70"><path d="M10 55 Q10 25 55 22 L185 22 Q195 22 195 35 L195 55 Q195 60 190 60 L15 60 Q10 60 10 55 Z" fill="#ef3340" stroke="#b51f2a" stroke-width="2"/><path d="M12 43 Q25 37 60 36 L195 39 L195 45 L12 50 Z" fill="#b7b7b7"/><rect x="70" y="30" width="22" height="12" rx="3" fill="#333"/><rect x="105" y="30" width="22" height="12" rx="3" fill="#333"/><rect x="140" y="30" width="22" height="12" rx="3" fill="#333"/><circle cx="55" cy="60" r="7" fill="#555"/><circle cx="95" cy="60" r="7" fill="#555"/><circle cx="150" cy="60" r="7" fill="#555"/></svg>
      <span>こまち</span>
    </button>
    <button class="train-btn" data-train="yamanote" aria-label="やまのてせん">
      <svg viewBox="0 0 200 70"><rect x="10" y="16" width="180" height="44" rx="8" fill="#e8ecef" stroke="#aeb8be" stroke-width="2"/><rect x="168" y="18" width="20" height="40" rx="5" fill="#9acd32"/><rect x="12" y="45" width="176" height="8" fill="#9acd32"/><rect x="25" y="25" width="28" height="14" rx="3" fill="#333"/><rect x="65" y="25" width="28" height="14" rx="3" fill="#333"/><rect x="105" y="25" width="28" height="14" rx="3" fill="#333"/><circle cx="55" cy="60" r="7" fill="#555"/><circle cx="145" cy="60" r="7" fill="#555"/></svg>
      <span>やまのてせん</span>
    </button>
    <button class="train-btn" data-train="inokashira" aria-label="いのかしらせん">
      <svg viewBox="0 0 200 70"><rect x="10" y="16" width="180" height="44" rx="8" fill="#eef1f2" stroke="#aeb8be" stroke-width="2"/><rect x="168" y="18" width="20" height="40" rx="5" fill="#6f4aa8"/><rect x="12" y="45" width="176" height="8" fill="#6f4aa8"/><rect x="25" y="25" width="28" height="14" rx="3" fill="#333"/><rect x="65" y="25" width="28" height="14" rx="3" fill="#333"/><rect x="105" y="25" width="28" height="14" rx="3" fill="#333"/><circle cx="55" cy="60" r="7" fill="#555"/><circle cx="145" cy="60" r="7" fill="#555"/></svg>
      <span>いのかしらせん</span>
    </button>
    <button class="train-btn" data-train="tozai" aria-label="とうざいせん">
      <svg viewBox="0 0 200 70"><rect x="10" y="16" width="180" height="44" rx="8" fill="#e8ecef" stroke="#aeb8be" stroke-width="2"/><rect x="168" y="18" width="20" height="40" rx="5" fill="#3085cc"/><rect x="12" y="43" width="176" height="5" fill="#32a5d2"/><rect x="12" y="49" width="176" height="5" fill="#2362a8"/><rect x="25" y="25" width="28" height="14" rx="3" fill="#333"/><rect x="65" y="25" width="28" height="14" rx="3" fill="#333"/><rect x="105" y="25" width="28" height="14" rx="3" fill="#333"/><circle cx="55" cy="60" r="7" fill="#555"/><circle cx="145" cy="60" r="7" fill="#555"/></svg>
      <span>とうざいせん</span>
    </button>
    <button class="train-btn" data-train="sobu" aria-label="そうぶせん">
      <svg viewBox="0 0 200 70"><rect x="10" y="16" width="180" height="44" rx="8" fill="#e8ecef" stroke="#aeb8be" stroke-width="2"/><rect x="168" y="18" width="20" height="40" rx="5" fill="#f0c928"/><rect x="12" y="45" width="176" height="8" fill="#f0c928"/><rect x="25" y="25" width="28" height="14" rx="3" fill="#333"/><rect x="65" y="25" width="28" height="14" rx="3" fill="#333"/><rect x="105" y="25" width="28" height="14" rx="3" fill="#333"/><circle cx="55" cy="60" r="7" fill="#555"/><circle cx="145" cy="60" r="7" fill="#555"/></svg>
      <span>そうぶせん</span>
    </button>
    <button class="train-btn" data-train="chuo" aria-label="ちゅうおうせん">
      <svg viewBox="0 0 200 70"><rect x="10" y="16" width="180" height="44" rx="8" fill="#e8ecef" stroke="#aeb8be" stroke-width="2"/><rect x="168" y="18" width="20" height="40" rx="5" fill="#f28c28"/><rect x="12" y="45" width="176" height="8" fill="#f28c28"/><rect x="25" y="25" width="28" height="14" rx="3" fill="#333"/><rect x="65" y="25" width="28" height="14" rx="3" fill="#333"/><rect x="105" y="25" width="28" height="14" rx="3" fill="#333"/><circle cx="55" cy="60" r="7" fill="#555"/><circle cx="145" cy="60" r="7" fill="#555"/></svg>
      <span>ちゅうおうせん</span>
    </button>
    <button class="train-btn" data-train="keio" aria-label="けいおうせん">
      <svg viewBox="0 0 200 70"><rect x="10" y="16" width="180" height="44" rx="8" fill="#e8ecef" stroke="#aeb8be" stroke-width="2"/><rect x="168" y="18" width="20" height="40" rx="5" fill="#d31359"/><rect x="12" y="42" width="176" height="5" fill="#d31359"/><rect x="12" y="49" width="176" height="5" fill="#174f9a"/><rect x="25" y="25" width="28" height="14" rx="3" fill="#333"/><rect x="65" y="25" width="28" height="14" rx="3" fill="#333"/><rect x="105" y="25" width="28" height="14" rx="3" fill="#333"/><circle cx="55" cy="60" r="7" fill="#555"/><circle cx="145" cy="60" r="7" fill="#555"/></svg>
      <span>けいおうせん</span>
    </button>
  </div>
  <!-- 更新時は sw.js の CACHE バージョンと揃える -->
  <div id="app-version" aria-label="つなげて！でんしゃ！、バージョン33、2026年7月19日14時20分更新">
    <span class="version-title">つなげて！でんしゃ！</span>
    <strong>v33</strong><span>2026.07.19 14:20 更新</span>
  </div>
</div>

<!-- 走行画面の操作ボタン -->
<div id="run-ui" class="hidden">
  <button class="btn-quick-add" data-slot="0"><span class="quick-train-art"></span><span class="quick-plus">＋</span></button>
  <button class="btn-quick-add" data-slot="1"><span class="quick-train-art"></span><span class="quick-plus">＋</span></button>
  <button class="btn-quick-add" data-slot="2"><span class="quick-train-art"></span><span class="quick-plus">＋</span></button>
  <button class="btn-quick-add" data-slot="3"><span class="quick-train-art"></span><span class="quick-plus">＋</span></button>
  <button class="btn-quick-add" data-slot="4"><span class="quick-train-art"></span><span class="quick-plus">＋</span></button>
  <button class="btn-quick-add" data-slot="5"><span class="quick-train-art"></span><span class="quick-plus">＋</span></button>
  <button class="btn-quick-add" data-slot="6"><span class="quick-train-art"></span><span class="quick-plus">＋</span></button>
  <button class="btn-quick-add" data-slot="7"><span class="quick-train-art"></span><span class="quick-plus">＋</span></button>
  <button class="btn-quick-add" data-slot="8"><span class="quick-train-art"></span><span class="quick-plus">＋</span></button>
  <button id="btn-couple" class="btn-quick-add" aria-label="いまの車両を連結"><span class="quick-train-art"></span><span class="quick-plus">＋</span></button>
  <button id="btn-remove" aria-label="きりはなす">🚃−</button>
</div>

<button id="btn-home" class="hidden" aria-label="えらびなおす">🏠</button>

<div id="drive-panel" class="hidden">
  <div id="speed-meter" aria-label="いまのスピード、走行距離、駅までの残り距離">
    <div class="speed-row"><span id="speed-value">0</span><small>km/h</small></div>
    <div id="distance-meter"><small>そうこうきょり</small><div class="distance-main"><span id="distance-value">0</span><small>m</small></div><small id="distance-km-value">0.0 km</small></div>
    <div id="remaining-meter">
      <div class="remaining-row"><small id="next-station-distance-label">つぎのえきまで</small><div class="remaining-values"><div class="remaining-main"><span id="next-station-distance-value">0</span><small>m</small></div><small id="next-station-distance-km">0.0 km</small></div></div>
      <div class="remaining-row"><small id="terminal-distance-label">しゅうてんまで</small><div class="remaining-values"><div class="remaining-main"><span id="terminal-distance-value">0</span><small>m</small></div><small id="terminal-distance-km">0.0 km</small></div></div>
    </div>
  </div>
  <button id="btn-express" aria-label="中央特快モードにする" aria-pressed="false">
    <span>🚄</span><span id="express-label">かくえき</span>
  </button>
  <button id="btn-running-sound" aria-label="走行音を消す" aria-pressed="true">
    <span id="running-sound-icon">🔊</span><span>そうこうおん</span>
  </button>
  <button id="btn-auto-mode" aria-label="自動運転をはじめる" aria-pressed="false">
    <span>🤖</span><span id="auto-mode-label">じどう</span>
  </button>
</div>

<div id="arrival-banner" class="hidden">とうちゃく〜！</div>

<div id="play-timer" class="hidden" aria-label="あそんだじかん">
  <span>⏱️</span><strong id="play-time-value">00:00</strong>
</div>

<button id="btn-komachi-couple" class="hidden" aria-label="こまちとれんけつ">
  <span class="couple-icon">🚄💞🚅</span>
  <span>れんけつ！</span>
</button>

<button id="btn-station-doors" class="hidden" aria-label="ドアをあける">
  <span class="door-icon">🚪</span>
  <span id="door-label">ドアをあける</span>
</button>

<div id="station-passengers" class="hidden" aria-hidden="true"></div>

<button id="onboard-panel" class="hidden" type="button" aria-live="polite" aria-expanded="false" aria-label="のっているひと。タップでいきさきを見る">
  <span class="onboard-compact"><strong>🚃 <span id="onboard-summary">0にん</span></strong><span id="onboard-hint">▾</span></span>
  <span id="onboard-list">まだ だれも のっていないよ</span>
</button>

<div id="play-controls" class="hidden">
  <button id="btn-driver" aria-label="うんてんしごっこ"><span>🧑‍✈️</span><span>うんてんし</span></button>
  <button id="btn-stamps" aria-label="えきスタンプちょうをひらく"><span>📖</span><span>スタンプ</span></button>
</div>

<div id="stamp-book" class="hidden" role="dialog" aria-modal="true" aria-labelledby="stamp-title">
  <div class="stamp-sheet">
    <button id="btn-close-stamps" aria-label="スタンプちょうをとじる">×</button>
    <h2 id="stamp-title">📖 えきスタンプちょう</h2>
    <p id="stamp-count">0 / 0 えき</p>
    <p class="stamp-save-note">💾 このiPadに じどうほぞん</p>
    <div id="stamp-grid"></div>
  </div>
</div>

<div id="route-event-banner" class="hidden" role="status" aria-live="polite"></div>
<div id="play-banner" class="hidden" role="status" aria-live="polite"></div>

<button id="btn-headlight" class="hidden" aria-label="ライトをつける">
  <span>🔦</span><span id="headlight-label">ライトをつける</span>
</button>

<script src="app.js"></script>
</body>
</html>
